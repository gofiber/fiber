name: Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  deployments: write
  contents: write
  pull-requests: write

jobs:
  benchmark:
    uses: gofiber/.github/.github/workflows/benchmark.yml@main
    with:
      # ~3 months of main pushes; also keeps benchmarks/data.js (~80 MB) below
      # GitHub's 100 MB per-file push limit.
      max-items-in-chart: 185
      # ~15 min of benchmark time against ~20s of compile, so this scales close to
      # linearly. The shards are merged before anything is compared or published.
      shards: 4
      # the 54 _Parallel benchmarks were run and then dropped from the results;
      # skipping them up front saves that time. filter-parallel stays as the guard
      # that keeps them out of the chart history if this flag is ever lost.
      go-test-flags: -skip _Parallel
      filter-parallel: true
      go-force-package-suffix: true
