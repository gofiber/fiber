_extends: .github
# The base branch decides for PRs, plain title matching hit Go module paths like "utils/v2".
# Issues have no base branch, there a v2/v3 marker anywhere in the title or the version in the body decides.
labels:
  - label: 'v3'
    except:
      baseBranch: '/^v2$/'
    matcher:
      baseBranch: '/^main$/'
      title: '/(?<![\w/.-])v3\b/i'
      body: '/(v3)/i'
  - label: 'v2'
    except:
      baseBranch: '/^main$/'
    matcher:
      baseBranch: '/^v2$/'
      title: '/(?<![\w/.-])v2\b/i'
  # Same two-alternative shape as the shared config: "perf:" prefix anywhere, free-text only before the first ":".
  - label: '⚡️ Performance'
    matcher:
      title: '/(perf(\([^)]+\))?!?:|^[^:]*\b(perf|performances?|performant|optimi[sz](e[sd]?|ing|ations?)|benchmark(s|ed|ing)?|speed[- ]?ups?|faster)\b)/i'
